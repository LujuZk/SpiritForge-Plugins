# ─── SFCore — configuración global ────────────────────────────────────────
# Este config es consumido por SFCore y por todos los plugins de la suite
# que dependan de SFCore para acceso a base de datos (SFCompass, SFCrafting,
# SFSkilltree, SFCharacter, etc.). Cambiar el motor aquí lo cambia para toda
# la suite.

database:
  # sqlite | mysql
  type: sqlite

  # Threads dedicados para operaciones async de DB (reads/writes no bloqueantes)
  async-threads: 2

  # Solo se usa cuando type: mysql
  mysql:
    host: localhost
    port: 3306
    database: spiritforge
    username: sfuser
    password: changeme
    pool-size: 10
    # Prefijo aplicado a los nombres de tabla por namespace.
    # Las tablas se crean como <namespace>_<tabla>, ej: sfcompass_compass_levels
    # Así todos los plugins caben en una sola DB sin colisiones.

  # Solo se usa cuando type: sqlite
  sqlite:
    # Directorio relativo a plugins/SFCore/ donde se crean los .db por namespace
    directory: db


mana:
  enabled: true
  base-max: 100.0
  base-regen: 2.0
  int-to-max: 5.0
  int-to-regen: 0.10
  start-full: true
damage-popups:
  enabled: true
  show-players: false
  duration-ticks: 20
  y-offset: 0.45
  rise-per-tick: 0.025
magic-staves:
  enabled: true
  refresh-interval-ticks: 20
  shoot:
    projectile-particle-ticks: 6
  # Cada clave debe ser el ID de Oraxen del bastón.
  # El bonus se suma si el item está en mano principal o secundaria.
  items:
    magic_staff_stick:
      magic-damage: 2.0
      shoot-cooldown-ticks: 10
      shoot-damage-multiplier: 0.8
    magic_staff_novice:
      magic-damage: 4.0
      shoot-cooldown-ticks: 20
      shoot-damage-multiplier: 1.2
