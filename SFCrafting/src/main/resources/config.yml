spellcraft:
  enabled: true
  cast-skill-map:
    attack_aoe: "SF_Dynamic_AttackAOE"
    attack_projectile: "SF_Dynamic_Projectile"
    buff: "SF_Dynamic_Buff"
  projectile-visual:
    # ITEM:
    #   Usa el proyectil interno de SFCrafting (Snowball) con modelo de item de Oraxen.
    #   El modelo se define por plantilla en "projectile-model-item".
    #
    # BETTERMODEL:
    #   No usa item en vuelo. En su lugar castea una skill de MythicMobs para el proyectil visual.
    #   Requiere que esa skill esté armada con BetterModel (ej. projectile bulletType=MOB + mobType con modelo).
    #   Skill usada:
    #   1) "mythic-skill" de la plantilla (si está definido)
    #   2) fallback "cast-skill-map.attack_projectile"
    mode: BETTERMODEL # ITEM | BETTERMODEL
  debug:
    # Muestra en chat/log qué skill se eligió y si cayó en fallback (cast-skill-map).
    fallback: false
  output:
    material: ENCHANTED_BOOK
    name-format: "&d{spell_name} &8- &7{class_name}"
    lore:
      - "&8Tipo: &7{spell_type}"
      - "&8Clase: &7{class_name}"
      - "&8Puntos usados: &f{points_used}&7/&f{points_total}"
